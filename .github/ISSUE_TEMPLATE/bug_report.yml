name: Bug report
description: Something in yadokari doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through [SECURITY.md](https://github.com/dotmatrx/yadokari/blob/main/SECURITY.md) instead, and never paste your API token here.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot helps for anything on screen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a review session
        2. Answer a reading with …
        3. …

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `yadokari --version`.
      placeholder: yadokari v0.6.2
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Homebrew
        - Release download
        - go install
        - Built from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1, Fedora 45, …
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Its name and version, and tmux or ssh if you use them.
      placeholder: Ghostty 1.3, kitty 0.44, …
    validations:
      required: true

  - type: textarea
    id: terminal-report
    attributes:
      label: Output of `yadokari --terminal`
      description: For anything to do with glyphs, colours or layout. It may name your home folder; trim that if you like.
      render: text

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Relevant lines from `yadokari.log`, next to the database (`~/.local/share/yadokari/`, or `$XDG_DATA_HOME/yadokari/`). The log never holds your token, but check it before pasting.
      render: text
