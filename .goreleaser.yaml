# Release builds: `git tag -a vX.Y.Z && git push origin vX.Y.Z` runs
# .github/workflows/release.yml, which runs this. Check it locally with
# `just release-check`.
version: 2
project_name: yadokari

builds:
  - id: yadokari
    main: ./cmd/yadokari
    binary: yadokari
    env: [CGO_ENABLED=0] # static: pure-Go SQLite, no libc
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Tag }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, docs/config.example.toml]

# Linux packages, attached to the release: one .deb and one .rpm per
# architecture serve every distro and version, since the binary is static.
# Installed by hand (`sudo dnf install ./yadokari-….rpm`, `sudo apt install
# ./yadokari_….deb`); there's no package repository, so no updates through
# dnf or apt. Nothing is required: fontconfig and a static (not variable) CJK
# font are recommended for drawing kanji, an audio player is suggested.
nfpms:
  - id: packages
    ids: [yadokari]
    package_name: yadokari
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    vendor: dotmatrx
    homepage: https://yadokari.dotmatrx.com
    maintainer: Justin Harris <justin@dotmatrx.com>
    description: |-
      Unofficial terminal client for WaniKani reviews and lessons.
      Not affiliated with WaniKani or Tofugu LLC.
    license: MIT
    section: education
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/yadokari/README.md
      - src: docs/config.example.toml
        dst: /usr/share/doc/yadokari/config.example.toml
      - src: LICENSE
        dst: /usr/share/doc/yadokari/LICENSE
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/yadokari/LICENSE
        packager: rpm
        type: license
    overrides:
      deb:
        recommends: [fontconfig, fonts-noto-cjk]
        suggests: [pipewire-bin | pulseaudio-utils | ffmpeg | mpv]
      rpm:
        recommends: [fontconfig, google-noto-sans-cjk-fonts]
        suggests: [pipewire-utils]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^Merge "]

release:
  prerelease: auto # v1.0.0-rc.1 and the like

# Homebrew: `brew install dotmatrx/tap/yadokari`. Publishes to the public repo
# dotmatrx/homebrew-tap with the HOMEBREW_TAP_TOKEN secret; skipped without
# it. The binary isn't signed, so the cask clears macOS's quarantine flag.
homebrew_casks:
  - name: yadokari
    repository:
      owner: dotmatrx
      name: homebrew-tap
      # Must be exactly one {{ .Env.X }}: GoReleaser applies tokens with a
      # restricted template (no envOrDefault). skip_upload runs first, so this
      # is never read when the secret is unset.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    homepage: https://yadokari.dotmatrx.com
    description: Unofficial terminal client for WaniKani reviews and lessons
    license: MIT
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/yadokari"]
          end
